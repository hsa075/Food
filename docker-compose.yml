services:
  postgres:
    image: postgres:16-alpine
    container_name: uttara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uttara_user
      POSTGRES_PASSWORD: uttara_secure_password
      POSTGRES_DB: uttara_db
    ports:
      - "5433:5432"
    volumes:
      - uttara_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uttara_user -d uttara_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uttara_pg_data:
